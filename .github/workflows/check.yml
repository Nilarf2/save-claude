name: Game checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the pinned General Engine package
        run: node tools/check-general-engine.mjs
      - run: npm run build
      - run: npm run check
      - name: Keep committed browser artifacts current
        run: git diff --exit-code -- web/story.json web/engine-runtime.js
